<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Problem Solving Mind</title>
    <script>
      // GitHub Pages SPA fallback: preserve the requested path and load the app
      // via the root entry point so client-side routing can render the route.
      (function () {
        var path = window.location.pathname + window.location.search;
        var clean = path === '/' ? path : path.replace(/\/+$/, '') || '/';
        window.location.replace('/?redirect=' + encodeURIComponent(clean));
      })();
    </script>
  </head>
  <body></body>
</html>
